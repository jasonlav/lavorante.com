<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>The Kitchen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
          crossorigin="anonymous"></script>
  <style>
      html {
          min-height: 100%;
      }

      body {
          background: #ff9933;
          background: linear-gradient(0deg, rgba(255,116,51,1) 0%, rgba(255,153,51,1) 100%);
      }

      .alerts {
          min-height: 60px;
      }

      .mississippi__text {
          font-size: 36px;
          letter-spacing: 0.5em;
          font-weight: bold;
          font-family: "Courier New", monospace;
          text-align: center;
      }

      .show-btn {
          appearance: none;
          border: none;
          pointer: cursor;
          background: transparent;
          padding: 0;
          margin: 0;
          position: absolute;
          right: 1rem;
          top: 50%;
          color: var(--bs-body-color);
          transform: translate(0, -50%);
          font-size: 0.8rem;
          opacity: 0.65;
      }

      .copy {
          visibility: hidden;
          pointer-events: none;
          width: 0;
          height: 0;
      }

      .card {
        box-shadow: 0 0 10px rgb(0 0 0 / 30%)
      }
  </style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
  </symbol>
  <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
  </symbol>
</svg>

<div class="modal mississippi" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body align-items-center">
        <div class="mississippi__text"></div>
      </div>
    </div>
  </div>
</div>

<div class="container container-sm">
  <div class="alerts mt-3 mb-3"></div>
  <div class="card mt-3 mb-5">
    <div class="card-body">
      <form id="form" method="post">
        <div class="form-floating mb-3">
          <select id="recipe" name="recipe" class="form-select">
            <option value="p">Stone soup</option>
            <option value="pa">a soup</option>
          </select>
          <label for="recipe" class="form-label">Recipe</label>
        </div>
        <div class="form-floating mb-3 mt-3">
          <input type="text" id="protein" name="protein" class="form-control" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required/>
          <label for="protein" class="form-label">Protein</label>
        </div>
        <div class="form-floating mb-3 mt-3">
          <input type="password" id="seasoning" name="seasoning" class="form-control" autocomplete="off" required/>
          <label for="seasoning" class="form-label">Seasoning</label>
          <button class="show-btn" tabindex="-1" type="button">show</button>
        </div>
        <div class="mt-3">
          <button type="submit" class="dash btn btn-secondary" data-action="dash">Dine & Dash</button>
          <button type="submit" class="dine btn btn-secondary" data-action="dine">Dine</button>
          <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target=".mississippi">
            Mississippi
          </button>
          <button type="button" class="copy">Copy</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="index.js"></script>
</body>
</html>
